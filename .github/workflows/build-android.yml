name: Build Android

# Manual only. Releases are made by hand: the version is bumped on the branch,
# the app is built locally, and the App Bundle is uploaded to Play Console by
# the user. Nothing here tags a commit, creates a GitHub Release, or talks to
# Play — this workflow exists for the times a clean build from a machine that
# isn't the user's is wanted, and it leaves the APK and the App Bundle in the
# run's artifacts. With the Android signing secrets set it signs with the
# upload key; without them, with a throwaway debug key.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.read.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pubspec.yaml version
        id: read
        run: |
          name=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+[[:space:]]*$/\1/p' pubspec.yaml)
          if [ -z "$name" ]; then
            echo "::error::pubspec.yaml version must look like x.y.z+N"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a throwaway debug key, so this build cannot go to Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build app bundle and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # RUN-2 and ADS-6: since the ads item, the release build asks for
      # INTERNET, and for that one reason. What the store listing promises is
      # that nothing the user records leaves the device (ADS-7), so the check
      # is now the other way round: internet must be there, and none of the
      # permissions that would let the app read the user's life may be.
      - name: Check what the APK asks for
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if ! grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::The release APK has no INTERNET permission, so no ad can fill (ADS-6)."
            exit 1
          fi
          # Nothing here has any business in this app, and a plugin update is
          # how one would arrive unnoticed.
          forbidden='ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION
            READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS
            READ_SMS SEND_SMS RECEIVE_SMS READ_CALL_LOG WRITE_CALL_LOG READ_PHONE_NUMBERS
            READ_CALENDAR WRITE_CALENDAR BODY_SENSORS ACTIVITY_RECOGNITION
            WRITE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE QUERY_ALL_PACKAGES'
          for permission in $forbidden; do
            if grep -q "android.permission.$permission" permissions.txt; then
              echo "::error::The release APK requests $permission, which nothing in this app needs (ADS-7)."
              exit 1
            fi
          done

      - name: Name the files after the version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/monthly-expenses-$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/monthly-expenses-$NAME.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ env.NAME }}
          path: dist/
          retention-days: 14

