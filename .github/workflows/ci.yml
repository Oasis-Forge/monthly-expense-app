name: CI

# Public repo: GitHub-hosted runners (including macOS) are free, so every PR
# compiles Android and iOS. Desktop builds run only on pushes to main, to keep
# PR checks fast. No path filters, so required status checks never hang.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # The generated lib/l10n/app_localizations*.dart files are committed;
      # they must match the ARB files (LANG-2).
      - name: Check generated localizations
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      # Every merged PR is a release (release-android.yml), so the version in
      # pubspec.yaml must be above the latest vX.Y.Z tag and have a CHANGELOG.md
      # entry. Dependabot PRs ship with the next release instead.
      - name: Check version bump
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          parse() { sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1 \2/p'; }
          read -r name build < <(parse < pubspec.yaml) || true
          [ -n "${name:-}" ] || fail "pubspec.yaml version must look like x.y.z+N"
          tags=$(git ls-remote --tags --refs origin 'v*')
          last_tag=$(printf '%s\n' "$tags" | sed -n 's|.*refs/tags/||p' | sort -V | tail -n 1)
          if [ -n "$last_tag" ]; then
            git fetch --quiet --depth=1 origin "+refs/tags/$last_tag:refs/tags/$last_tag"
            read -r last_name last_build < <(git show "$last_tag:pubspec.yaml" | parse) || true
            highest=$(printf '%s\n%s\n' "$last_name" "$name" | sort -V | tail -n 1)
            if [ "$name" = "$last_name" ] || [ "$highest" != "$name" ]; then
              fail "$last_tag is released: raise the version above $last_name (major, minor, or patch)"
            fi
            [ "$build" -gt "$last_build" ] || fail "$last_tag is released: raise the build number above $last_build"
          fi
          awk -v heading="## [$name] - " 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || fail "CHANGELOG.md needs a '## [$name] - YYYY-MM-DD' entry"
          echo "Merging releases $name+$build (previous release: ${last_tag:-none})."

  android:
    name: Android build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

  desktop:
    name: Desktop build (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.target }} --debug
